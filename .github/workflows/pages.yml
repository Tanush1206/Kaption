# The website (site/): published to GitHub Pages on every push to main that
# changes it. Plain files, nothing to build. Needs Settings -> Pages ->
# Source: GitHub Actions, once.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned as a matching set on the v4 artifact backend: upload-pages-artifact
      # v3.0.1 uploads via upload-artifact v4, which deploy-pages v4.0.5 reads.
      # The earlier v6/v5.0.0/v5.0.1 bump broke this once GitHub removed the older
      # backend — upload passed but deploy found 0 artifacts ("ensure artifacts
      # are uploaded with actions/upload-artifact@v4 or later"). Don't bump these
      # three as a group without checking deploy still finds the "github-pages"
      # artifact.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
